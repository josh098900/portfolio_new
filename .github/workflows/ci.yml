name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: pixel-portfolio

jobs:
  checks:
    name: Types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pixel-portfolio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Also runs the post-build check that no secret ends up in the output.
      - run: npm run build

  browsers:
    name: Browser tests (Mac, iPhone, Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pixel-portfolio/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            pixel-portfolio/playwright-report/
            pixel-portfolio/test-results/
          retention-days: 7
